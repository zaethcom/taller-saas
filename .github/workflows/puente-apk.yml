name: APK del puente de impresión

# Solo cuando cambia puente/. El resto del repositorio es la aplicación web y no
# tiene nada que ver con esta compilación.
on:
  # En push solo para main: en una rama con PR abierto, el disparador de
  # pull_request ya cubre cada commit y si no se duplicaría cada ejecución.
  push:
    branches: [main]
    paths:
      - 'puente/**'
      - '.github/workflows/puente-apk.yml'
  pull_request:
    paths:
      - 'puente/**'
      - '.github/workflows/puente-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: puente

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('puente/**/*.gradle.kts', 'puente/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compilar APK de depuración
        run: ./gradlew --no-daemon assembleDebug

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest

      # El APK queda descargable desde la pestaña de Actions: es la forma de
      # instalarlo en el equipo de la sede sin montar Android Studio ahí.
      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: puente-debug-apk
          path: puente/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
