<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión · Taller 360</title>
<style>
  :root { --ink:#141d24; --ink-2:#42535e; --ground:#f4f6f7; --surface:#fff; --rule:#d8dee1; --accent:#0b6c78; }
  @media (prefers-color-scheme: dark) { :root { --ink:#eef1f3; --ink-2:#b9c3c8; --ground:#0b0b0c; --surface:#17181b; --rule:#2a2c31; --accent:#3fb0bd; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--ground); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:28px 24px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { color:var(--ink-2); line-height:1.5; margin:0 0 18px; }
  button { width:100%; height:48px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  ul { list-style:none; padding:0; margin:18px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  a { display:block; padding:10px 12px; border:1px solid var(--rule); border-radius:10px; color:var(--ink); text-decoration:none; font-weight:600; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>Sin conexión a internet</h1>
  <p>Esta pantalla necesita internet. Las de mostrador y taller se pueden usar sin conexión en un equipo donde ya se abrió la app con internet.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
  <ul>
    <li><a href="/vender">Vender</a></li>
    <li><a href="/recibir">Recibir</a></li>
    <li><a href="/entregar">Entregar</a></li>
    <li><a href="/escanear">Escanear</a></li>
  </ul>
</main>
<script>
  window.addEventListener("online", function () { location.reload(); });
</script>
</body>
</html>
